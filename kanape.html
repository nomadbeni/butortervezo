<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-NVStMrYMzzI+Zk/8Ud6/ex27pH748cm5lPm9IRtDR6E='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b45309">
<title>Kanapé-tervező</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b45309'/%3E%3Cpath d='M8 15v-4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4M5 16a2 2 0 0 1 4 0v2h14v-2a2 2 0 0 1 4 0v6H5zM8 22v3M24 22v3' stroke='white' stroke-width='2.2' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
 --bg:#f3f6f9;--bg2:#ffffff;--fg:#0f172a;--muted:#64748b;--line:#e2e8f0;--hover:rgba(15,23,42,.05);
 --accent:#0284c7;--accent2:#0ea5e9;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;
 --in:#f8fafc;--glass:rgba(255,255,255,.85);--shadow:0 10px 30px -12px rgba(15,23,42,.25),0 2px 6px rgba(15,23,42,.06);
 --hdr:56px;--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111b;--bg2:#121a28;--fg:#e5e7eb;--muted:#94a3b8;--line:#223047;--hover:rgba(226,232,240,.07);--accent:#38bdf8;--accent2:#7dd3fc;--in:#0e1522;--glass:rgba(18,26,40,.85);--shadow:0 14px 36px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b111b;--bg2:#121a28;--fg:#e5e7eb;--muted:#94a3b8;--line:#223047;--hover:rgba(226,232,240,.07);--accent:#38bdf8;--accent2:#7dd3fc;--in:#0e1522;--glass:rgba(18,26,40,.85);--shadow:0 14px 36px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:0;z-index:20;height:calc(var(--hdr) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0284c7,#06b6d4);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.ttl{font-weight:800;font-size:16px;white-space:nowrap}
.grow{flex:1}
.ib{width:38px;height:38px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib svg{width:20px;height:20px}
.air{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13px;white-space:nowrap}
.air b{font-weight:700}.air span{color:var(--muted)}
.air:hover{border-color:var(--accent)}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;max-width:1380px;margin:0 auto;padding:18px 16px 40px}
nav.side{position:sticky;top:calc(var(--hdr) + 18px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600}
nav.side button svg{width:18px;height:18px;flex:none}
nav.side button:hover{background:var(--hover);color:var(--fg)}
nav.side button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] nav.side button.on{color:#06202e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.side button.on{color:#06202e}}
nav.side hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
nav.side .ver{font-size:11px;color:var(--muted);padding:8px 12px}

main{min-width:0;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.span2{grid-column:1/-1}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.f>.l{font-size:12px;font-weight:600;color:var(--muted)}
.iw{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--in);overflow:hidden}
.iw:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.iw input{flex:1;min-width:0;border:0;background:transparent;padding:9px 10px;font-variant-numeric:tabular-nums;font-weight:600;outline:none}
.iw select,.iw .u{border:0;border-left:1px solid var(--line);background:transparent;padding:0 8px;font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;white-space:nowrap}
.iw select{cursor:pointer;outline:none}
select.sel,input.txt{border:1px solid var(--line);border-radius:10px;background:var(--in);padding:9px 10px;width:100%;outline:none}
select.sel:focus,input.txt:focus{border-color:var(--accent)}
.seg{display:inline-flex;background:var(--in);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--bg2);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.hint b{color:var(--fg)}

.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv{background:var(--in);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kv small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.kv b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;word-break:break-word}
.kv i{font-style:normal;font-size:12px;color:var(--muted);font-weight:600;margin-left:3px}
.kv.big{grid-column:span 2;background:color-mix(in srgb,var(--accent) 10%,var(--bg2));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.kv.big b{font-size:30px;color:var(--accent)}
.kv .alt{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06202e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06202e}}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--danger)}

.gauge{position:relative;height:30px;border-radius:8px;overflow:hidden;display:flex;font-size:10.5px;font-weight:700;color:#fff}
.gauge div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--fg);box-shadow:0 0 0 2px var(--bg2);border-radius:2px;transition:left .25s}
.zone{font-size:13px;font-weight:600}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.t td.n,.t th.n{text-align:right}
.t tr.best td{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.t input{width:100%;min-width:60px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.t input:hover{border-color:var(--line)}.t input:focus{border-color:var(--accent);background:var(--in)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.pill{display:inline-block;white-space:nowrap;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.pill.na{background:var(--hover);color:var(--muted)}

.tgrid{display:grid;gap:4px}
.tgrid input{width:100%;border:1px solid var(--line);background:var(--in);border-radius:8px;padding:7px 4px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;outline:none;min-width:0}
.tgrid input:focus{border-color:var(--accent)}
.tgrid input.neg{border-color:var(--danger);color:var(--danger)}
.tgrid .hd{font-size:10.5px;color:var(--muted);font-weight:700;text-align:center;align-self:end;font-family:var(--mono)}
.tgrid .rh{font-size:10.5px;color:var(--muted);font-weight:700;font-family:var(--mono);display:flex;align-items:center;justify-content:flex-end;padding-right:4px}

.zeta{display:flex;flex-wrap:wrap;gap:6px}
.zeta button{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.zeta button:hover{border-color:var(--accent);color:var(--fg)}
.seglist{display:flex;flex-direction:column;gap:10px}
.segc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--in)}
.segc .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.segc .top b{font-size:13px}
.segc .out{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.segc .out b{color:var(--fg)}

svg.duct{width:100%;height:auto;max-height:240px}
.chart{width:100%;height:auto}

#modal{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .dlg{background:var(--bg2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
#modal h3{margin:0;font-size:18px}
#menu{position:fixed;inset:0;z-index:45;display:none}
#menu.on{display:block}
#menu .sheet{position:absolute;top:calc(var(--hdr) + env(safe-area-inset-top) + 6px);right:10px;width:min(320px,calc(100% - 20px));background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:75vh;overflow:auto}
.mi{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:500}
.mi:hover{background:var(--hover)}
.mi svg{width:18px;height:18px;color:var(--muted)}
.mh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 10px 4px}
.mi.cur{background:color-mix(in srgb,var(--accent) 12%,transparent)}
#pr_t{min-width:1080px}#pr_t td:nth-child(1){min-width:200px}#pr_t td:nth-child(2){min-width:110px}#pr_t td:nth-child(7){min-width:140px}#pr_t td:nth-child(8){min-width:170px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:all .2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

nav.bot{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr;padding:12px 12px 100px}
 nav.side{display:none}
 nav.bot{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:blur(12px);border-top:1px solid var(--line);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;scrollbar-width:none}
 nav.bot button{flex:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;min-width:64px}
 nav.bot button svg{width:20px;height:20px}
 nav.bot button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
 .grid,.grid.c3{grid-template-columns:1fr}
 .kv.big{grid-column:1/-1}
 .air .x{display:none}
 .ttl{display:none}
}
@media print{
 header,nav,#toast,.noprint,.btn{display:none!important}
 body{background:#fff;color:#000}
 .app{display:block;padding:0}
 .card{box-shadow:none;border:0;padding:0}
 .t input{border:0}
 .tw{border:0;overflow:visible}
}


.logo{background:var(--logo)!important}


:root{--accent:#b45309;--accent2:#d97706}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#f59e0b;--accent2:#fbbf24}}
:root[data-theme="dark"]{--accent:#f59e0b;--accent2:#fbbf24}


.kpg{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.kcol{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1180px){.kpg{grid-template-columns:1fr}}
.tb{gap:6px}.tb .l{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}.tb .seg button{padding:5px 9px}
.cv{background:#fcfcfa;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.cv svg{display:block;max-width:100%;height:auto}
.fields.f2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cks{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}.ck input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.tlist{display:flex;flex-direction:column;gap:6px}
.trw{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:6px;align-items:center}.trw.x{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto}
.trw .sel,.trw .txt{padding:6px 8px;font-size:13px}
.blist{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.bl{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:9px;cursor:pointer}
.bl:hover{background:var(--hover)}.bl.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.bl i{width:14px;height:14px;border-radius:4px;border:1px solid #1c2128}.bl span{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bl small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #1c2128}
.dms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dms .seg button{padding:5px 9px;font-size:12.5px}
.sheetw{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sheetw svg{display:block;width:100%;height:auto}
#kp_props{display:flex;flex-direction:column;gap:12px}
#kp_props .seg button{padding:5px 9px;font-size:12.5px}
#rep{display:none}
@media print{
 html:has(body.rep-on){color-scheme:light!important;background:#fff!important}
 body.rep-on{background:#fff!important}
 body.rep-on>*:not(#rep){display:none!important}
 body.rep-on #rep{display:block!important}
 #rep{page:kp}
 #rep svg{display:block;width:100%;height:auto;max-height:193mm}
}
@page kp{size:A4 landscape;margin:8mm}

</style>
</head>
<body>
<header>
 <div class="logo" style="--logo:linear-gradient(135deg,#b45309,#f59e0b)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 12a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v5H3z"/><path d="M5 17v2M19 17v2"/></svg></div>
 <div class="ttl">Kanapé-tervező</div>
 <div class="grow"></div>
 
 <a class="ib" href="index.html" title="Bútortervező kezdőlap" aria-label="Kezdőlap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg></a>
 <button class="ib" id="themeBtn" title="Téma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
 <button class="ib" id="menuBtn" title="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<div class="app">
 <nav class="side" id="side"></nav>
 <main id="main"></main>
</div>
<nav class="bot" id="bot"></nav>
<div id="menu"><div class="sheet" id="menuBody"></div></div>
<div id="modal"><div class="dlg" id="modalBody"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
(()=>{
'use strict';
/* ===== közös alap (app keret, mezők, téma, menü) ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const parse=s=>{try{return JSON.parse(s)}catch(e){return null}};
const num=v=>{if(v==null)return NaN;if(typeof v==='number')return v;const s=String(v).replace(/\s/g,'').replace(',','.');return s===''?NaN:+s};
const ok=x=>Number.isFinite(x);
function fmt(x,d=2){if(!ok(x))return '–';const a=Math.abs(x);let dd=d;if(a>=1000)dd=0;else if(a>=100)dd=Math.min(d,1);return x.toLocaleString('hu-HU',{minimumFractionDigits:0,maximumFractionDigits:dd})}
let toastT=0;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2200)}
const uid=()=>Math.random().toString(36).slice(2,10);

/* ===== import-ellenőrzés (közös) =====
   Szabályok: a fájl legfeljebb 2 MB, érvényes JSON objektum, a megfelelő "app" mezővel.
   Kötelező méretek (nem véges vagy tartományon kívüli szám) és a darabszám-korlátok átlépése -> elutasítás, érthető üzenettel.
   Opcionális mezők (szövegek, kapcsolók, választók) hibás típus esetén alapértékre állnak, a szövegek hossza korlátozott.
   Az importált azonosítókat az app nem használja: minden elem új, belső azonosítót kap. */
const IMP_MAX_BYTES=2*1024*1024;
class ImportErr extends Error{constructor(m){super(m);this.name='ImportErr'}}
const impFail=m=>{throw new ImportErr(m)};
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
/* egysoros szöveg: sortörés és TAB szóközre, egyéb vezérlőkarakter törölve, hossz korlátozva */
const vStr=(v,max=200,def='')=>(typeof v==='string'?v:(typeof v==='number'&&Number.isFinite(v)?String(v):def)).replace(/[\t\r\n]+/g,' ').replace(/[\u0000-\u001f\u007f]/g,'').slice(0,max);
const vNumRaw=v=>typeof v==='number'?v:(typeof v==='string'&&v.trim()!==''&&v.length<40?num(v):NaN);
const vNum=(v,lo,hi,what)=>{const n=vNumRaw(v);if(!Number.isFinite(n)||n<lo||n>hi)impFail(`Érvénytelen érték: ${what} (${lo} és ${hi} közötti szám kell)`);return n};
const vNumOpt=(v,lo,hi,def)=>{const n=vNumRaw(v);return Number.isFinite(n)?Math.min(hi,Math.max(lo,n)):def};
const vArr=(v,max,what,min=0)=>{if(!Array.isArray(v))impFail(`Hiányzó vagy hibás lista: ${what}`);if(v.length>max)impFail(`Túl sok elem: ${what} (legfeljebb ${max})`);if(v.length<min)impFail(`Üres lista: ${what}`);return v};
const vObj=(v,what)=>{if(!isObj(v))impFail(`Hibás adat: ${what}`);return v};
const vOne=(v,list,def)=>list.includes(v)?v:def;
const vFlag=v=>v===true||v===1||v==='1'?'1':'';
const vBool=v=>v===true||v===1||v==='1'?1:0;
function parseImport(text,app,appName){if(typeof text!=='string')impFail('A fájl nem szöveges.');
 if(text.length>IMP_MAX_BYTES)impFail('A fájl túl nagy (legfeljebb 2 MB lehet).');
 let d;try{d=JSON.parse(text)}catch(e){impFail('A fájl nem érvényes JSON.')}
 if(!isObj(d))impFail('A fájl nem tervfájl.');if(d.app!==app)impFail(`Ez nem ${appName} fájl.`);return d}
/* fájl beolvasása + ellenőrzése; a validate függvény a kész, ellenőrzött adatot adja vissza vagy ImportErr-t dob */
function readImport(file,app,appName,validate){return new Promise((res,rej)=>{
 if(!file)return rej(new ImportErr('Nincs fájl kiválasztva.'));
 if(file.size>IMP_MAX_BYTES)return rej(new ImportErr(`A fájl túl nagy (${(file.size/1048576).toFixed(1)} MB, legfeljebb 2 MB lehet).`));
 const rd=new FileReader();rd.onerror=()=>rej(new ImportErr('A fájl nem olvasható.'));
 rd.onload=()=>{try{res(validate(parseImport(rd.result,app,appName)))}catch(e){rej(e instanceof ImportErr?e:new ImportErr('Hibás tervfájl.'))}};
 rd.readAsText(file)})}
/* ===== tárolt terv védelme =====
   Betöltéskor hibás tárolt terv: az eredeti szöveg a <prefix>.state.bak kulcsra kerül, és a menüből letölthető (nem vész el csendben).
   Szerkesztéskor: az app guard()-ja minden mentés előtt ugyanazzal az ellenőrzéssel nézi az állapotot, mint az import;
   ha nem felel meg (pl. túl nagy méret, túl sok elem), a módosítást visszavonja, így a tárolt terv mindig betölthető marad. */
const bakKey=p=>p+'.state.bak';
function keepBadState(prefix){const raw=store.get(prefix+'.state');if(raw)store.set(bakKey(prefix),raw)}
const bakMenu=prefix=>store.get(bakKey(prefix))?`<button class="mi" data-m="bak">${ic('dl')}Hibás tárolt terv letöltése</button>`:'';
function downloadBak(prefix){const raw=store.get(bakKey(prefix));if(!raw)return;download(prefix+'_hibas_tarolt_terv.json',raw,'application/json');store.del(bakKey(prefix));toast('Letöltve; a böngészőből törölve.')}
/* check(): érvényes-e az állapot; snapshot(): az állapot szövegként; apply(d): visszaállítás egy korábbi pillanatképre.
   Visszaállítás mindig az utolsó, ellenőrzésen átment állapotra történik (nem a visszavonási verem tetejére). */
function makeGuard(check,snapshot,apply){let busy=false,last=null;
 return ()=>{if(busy)return true;try{check();last=snapshot();return true}catch(e){
  busy=true;const msg=e instanceof ImportErr?e.message:'Érvénytelen állapot.';
  try{if(last){apply(JSON.parse(last));toast(msg+' A módosítás visszavonva.')}else toast(msg+' A terv nem menthető: mentsd JSON-ba.')}
  catch(_){toast('A terv nem menthető: mentsd JSON-ba.')}finally{busy=false}return false}}}

 const out=ls.slice(0,max);if(ls.length>max)out[max-1]=out[max-1]+' '+ls.slice(max).join(' ');
 return out.map(l=>l.length>n?l.slice(0,Math.max(1,n-1))+'…':l)}
const pv=k=>{const v=num(S.p[k]);return ok(v)?v:NaN};

/* ---------- méretláncok ---------- */
function chain(all,cand,side){
 const H=side==='top'||side==='bottom';
 const lo=b=>H?b.x:b.y,hi=b=>H?b.x+b.w:b.y+b.h;
 const dep=b=>side==='top'?b.y:side==='bottom'?-(b.y+b.h):side==='left'?b.x:-(b.x+b.w);
 const behind=(t,c)=>side==='top'?eq(c.y,t.y+t.h):side==='bottom'?eq(c.y+c.h,t.y):side==='left'?eq(c.x,t.x+t.w):eq(c.x+c.w,t.x);
 const a0=Math.min(...cand.map(lo)),a1=Math.max(...cand.map(hi));
 const vs=[...new Set(all.flatMap(b=>[lo(b),hi(b)]).filter(v=>v>=a0-1e-6&&v<=a1+1e-6))].sort((a,b)=>a-b);
 const parts=[];
 for(let i=0;i<vs.length-1;i++){const a=vs[i],b=vs[i+1];if(b-a<1e-6)continue;const m=(a+b)/2;
  const cov=cand.filter(q=>lo(q)<m&&hi(q)>m).sort((p,q)=>dep(p)-dep(q));
  let k='gap',d=null;
  if(cov.length){const o=cov[0];k=o.id;d=dep(o);if(o.type==='trim'){const bh=all.find(c=>c!==o&&lo(c)<m&&hi(c)>m&&behind(o,c));if(bh)k+='/'+bh.id}}
  const L=parts[parts.length-1];
  if(L&&L.k===k){L.b=b;if(d!=null)L.d=L.d==null?d:Math.min(L.d,d)}else parts.push({a,b,k,d})}
 return parts}
function ticksOf(parts){const t=[];parts.forEach((p,i)=>{if(i===0)t.push({v:p.a,d:p.d});const n=parts[i+1];const ds=[p.d,n&&n.d].filter(x=>x!=null);t.push({v:p.b,d:ds.length?Math.min(...ds):null})});return t}
const SIDES=[['top','dT'],['bottom','dB'],['left','dL'],['right','dR']];
function layoutDims(it,st){
 const out={lv:{},offs:{},m:{}};
 for(const [side,key] of SIDES){
  const H=side==='top'||side==='bottom';const mode=S.p[key]||'off';const lv=[];
  if(it.length&&mode!=='off'){
   const full=chain(it,it,side);
   if(mode==='tot')lv.push([{v:full[0].a,d:full[0].d},{v:full[full.length-1].b,d:full[full.length-1].d}]);
   else{
    let cand=it;
    if(mode==='edge'){const ed=b=>side==='top'?b.y:side==='bottom'?-(b.y+b.h):side==='left'?b.x:-(b.x+b.w);const mn=Math.min(...it.map(ed));cand=it.filter(b=>eq(ed(b),mn))}
    const parts=chain(it,cand,side);
    if(parts.length>1)lv.push(ticksOf(parts));
    lv.push([{v:parts[0].a,d:parts[0].d},{v:parts[parts.length-1].b,d:parts[parts.length-1].d}])}}
  const offs=[];let off=st.fs*1.5;
  lv.forEach(tk=>{offs.push(off);off+=H?st.fs*1.75:maxLab(tk,st)+st.fs*1.1});
  out.lv[side]=lv;out.offs[side]=offs;
  out.m[side]=!lv.length?st.fs*.6:H?offs[offs.length-1]+st.fs*1.45:offs[offs.length-1]+maxLab(lv[lv.length-1],st)+st.fs*.7}
 return out}
function maxLab(tk,st){let m=0;for(let i=0;i<tk.length-1;i++)m=Math.max(m,tw(L1(tk[i+1].v-tk[i].v),st.fs));return m}
function arrow(x,y,dx,dy,al){const w=al*.34,bx=x-dx*al,by=y-dy*al;return `<path d="M${f(x)} ${f(y)}L${f(bx-dy*w)} ${f(by+dx*w)}L${f(bx+dy*w)} ${f(by-dx*w)}Z" fill="${INK}"/>`}
function dimSeg(x1,y1,x2,y2,label,pos,st,halo){
 const L=Math.hypot(x2-x1,y2-y1);if(L<.5)return '';const ux=(x2-x1)/L,uy=(y2-y1)/L;
 let o=line(x1,y1,x2,y2,st.lw);
 if(L>=st.al*2.4)o+=arrow(x1,y1,-ux,-uy,st.al)+arrow(x2,y2,ux,uy,st.al);
 else{const e=st.al*1.7;o+=line(x1-ux*e,y1-uy*e,x1,y1,st.lw)+line(x2,y2,x2+ux*e,y2+uy*e,st.lw)+arrow(x1,y1,ux,uy,st.al)+arrow(x2,y2,-ux,-uy,st.al)}
 const mx=(x1+x2)/2,my=(y1+y2)/2,fs=st.fs;
 const h=halo?` stroke="${halo}" stroke-width="${f(fs*.28)}" paint-order="stroke" stroke-linejoin="round"`:'';
 if(pos==='above')o+=tx(mx,my-fs*.32,label,fs,700,'middle',INK,h);
 else if(pos==='below')o+=tx(mx,my+fs*1.02,label,fs,700,'middle',INK,h);
 else if(pos==='left')o+=tx(mx-fs*.42,my+fs*.36,label,fs,700,'end',INK,h);
 else o+=tx(mx+fs*.42,my+fs*.36,label,fs,700,'start',INK,h);

function drawDims(LD,T,st){
 let o='';const bb=T.bb;if(!bb)return '';
 for(const [side] of SIDES){
  const H=side==='top'||side==='bottom',sg=side==='top'||side==='left'?-1:1;
  const base=side==='top'?T.Y(bb.y0):side==='bottom'?T.Y(bb.y1):side==='left'?T.X(bb.x0):T.X(bb.x1);
  const crd=d=>side==='top'||side==='left'?d:-d;
  LD.lv[side].forEach((tk,li)=>{
   const ln=base+sg*LD.offs[side][li];
   for(const t of tk){if(t.d==null)continue;const ob=H?T.Y(crd(t.d)):T.X(crd(t.d));const p=H?T.X(t.v):T.Y(t.v);const e1=ob+sg*st.fs*.22,e2=ln+sg*st.fs*.32;
    o+=H?line(p,e1,p,e2,st.lw*.75):line(e1,p,e2,p,st.lw*.75)}
   for(let i=0;i<tk.length-1;i++){const lab=L1(tk[i+1].v-tk[i].v);
    if(H){const p1=T.X(tk[i].v),p2=T.X(tk[i+1].v);o+=dimSeg(p1,ln,p2,ln,lab,side==='top'?'above':'below',st)}
    else{const p1=T.Y(tk[i].v),p2=T.Y(tk[i+1].v);o+=dimSeg(ln,p1,ln,p2,lab,side,st)}}})}
 return o}

/* ---------- felülnézet rajz ---------- */
function outline(bs,T){if(!bs.length)return '';
 const xs=[...new Set(bs.flatMap(b=>[b.x,b.x+b.w]))].sort((a,b)=>a-b),ys=[...new Set(bs.flatMap(b=>[b.y,b.y+b.h]))].sort((a,b)=>a-b);
 const nx=xs.length-1,ny=ys.length-1,C=[];
 for(let j=0;j<ny;j++){C[j]=[];const my=(ys[j]+ys[j+1])/2;for(let i=0;i<nx;i++){const mx=(xs[i]+xs[i+1])/2;C[j][i]=bs.some(b=>b.x<mx&&b.x+b.w>mx&&b.y<my&&b.y+b.h>my)}}
 const cv=(i,j)=>j>=0&&j<ny&&i>=0&&i<nx&&C[j][i];let d='';
 for(let j=0;j<=ny;j++){let s=null;for(let i=0;i<=nx;i++){const e=i<nx&&cv(i,j-1)!==cv(i,j);if(e&&s==null)s=i;if(!e&&s!=null){d+=`M${f(T.X(xs[s]))} ${f(T.Y(ys[j]))}H${f(T.X(xs[i]))}`;s=null}}}
 for(let i=0;i<=nx;i++){let s=null;for(let j=0;j<=ny;j++){const e=j<ny&&cv(i-1,j)!==cv(i,j);if(e&&s==null)s=j;if(!e&&s!=null){d+=`M${f(T.X(xs[i]))} ${f(T.Y(ys[s]))}V${f(T.Y(ys[j]))}`;s=null}}}
 return d}
function wave(x,y,w,h,st){const hz=w>=h,L=hz?w:h,th=hz?h:w;if(L<th*1.6||th<4)return '';
 const m=Math.max(th*.55,st.fs*.35),len=L-2*m;if(len<=th)return '';
 const a=Math.min(th*.19,st.fs*.26),n=Math.max(2,Math.round(len/Math.max(th*.62,st.fs*.42))),hw=len/n;let d;
 if(hz){d=`M${f(x+m)} ${f(y+th/2)}`;for(let i=0;i<n;i++)d+=`q${f(hw/2)} ${f((i%2?2:-2)*a)} ${f(hw)} 0`}
 else{d=`M${f(x+th/2)} ${f(y+m)}`;for(let i=0;i<n;i++)d+=`q${f((i%2?2:-2)*a)} ${f(hw/2)} 0 ${f(hw)}`}
 return `<path d="${d}" fill="none" stroke="#6b5238" stroke-width="${f(st.lw*.9)}" stroke-linecap="round"/>`}
function planSVG(it,T,st,opt={}){
 let o='';const nt=it.filter(b=>b.type!=='trim'),tr=it.filter(b=>b.type==='trim');
 const R=(b,a)=>`<rect x="${f(T.X(b.x))}" y="${f(T.Y(b.y))}" width="${f(b.w*T.s)}" height="${f(b.h*T.s)}" ${a}/>`;
 for(const b of nt)o+=R(b,`fill="${TY[b.type][1]}"`);
 for(const b of nt){if(b.type!=='seat')o+=R(b,`fill="none" stroke="#7d8793" stroke-width="${f(st.lw*.9)}"`);else if(S.p.seams)o+=R(b,`fill="none" stroke="#8a939e" stroke-width="${f(st.lw*.8)}" stroke-dasharray="${f(st.fs*.35)} ${f(st.fs*.25)}"`)}
 if(nt.length)o+=`<path d="${outline(nt,T)}" fill="none" stroke="${INK}" stroke-width="${f(st.lo)}" stroke-linecap="square"/>`;
 for(const b of tr){const w=b.w*T.s,h=b.h*T.s;o+=R(b,`rx="${f(Math.min(st.fs*.2,w/3,h/3))}" fill="${TY.trim[1]}" stroke="${INK}" stroke-width="${f(st.lo)}"`)+wave(T.X(b.x),T.Y(b.y),w,h,st)}
 for(const b of it){const fill=TY[b.type][1];
  if(b.dw){const y=T.Y(b.y+b.h*(b.dh?.4:.5));o+=dimSeg(T.X(b.x),y,T.X(b.x+b.w),y,L1(b.w),'above',st,fill)}
  if(b.dh){const x=T.X(b.x+b.w*(b.dw?.72:.5));o+=dimSeg(x,T.Y(b.y),x,T.Y(b.y+b.h),L1(b.h),'right',st,fill)}}
 if(opt.labels)for(const b of it){const w=b.w*T.s,h=b.h*T.s,fs=opt.lfs||st.fs*.9;if(w<fs*3.2||h<fs*2.4)continue;
  const n=Math.max(3,Math.floor((w-8)/(fs*.6))),ls=wrap(b.name,n,h>fs*4.6?2:1),cx=T.X(b.x)+w/2;let y=T.Y(b.y)+fs*1.3;
  for(const l of ls){o+=tx(cx,y,l,fs,700,'middle','#334155');y+=fs*1.12}
  if(opt.sizes&&h>fs*(2.6+ls.length*1.2))o+=tx(cx,y,`${L1(b.w)} × ${L1(b.h)}`,fs*.88,500,'middle','#64748b')}

function sideView(bx,by,bw,bh,fs){
 const g=(k,d)=>{const v=pv(k);return ok(v)?v:d};
 const H=Math.max(5,g('H',43)),leg=clamp(g('leg',5),0,H-2),cush=clamp(g('cush',12),0,H-leg-1),D=Math.max(10,g('D',90)),bH=Math.max(0,g('bH',0)),bD=clamp(g('bD',0),0,D);
 const hasB=bH>0&&bD>0,tot=H+(hasB?bH:0),st={fs,al:fs*.55,lw:fs*.075};
 const ml=tw(L1(H),fs)+fs*1.5,mr=hasB?tw(L1(tot),fs)+fs*1.5:fs*.6,mt=fs*.5,mb=fs*.6;
 const s=Math.min((bw-ml-mr)/D,(bh-mt-mb)/tot);
 const x0=bx+ml+((bw-ml-mr)-D*s)/2,yF=by+mt+tot*s+((bh-mt-mb)-tot*s)/2;
 const X=v=>x0+v*s,Y=v=>yF-v*s,lw=fs*.1;
 let o=line(X(-5),yF,X(D+5),yF,lw*.8,'#c4c9cf');
 const lg=Math.min(7,D*.07);
 if(leg>0)for(const lx of[5,D-5-lg])o+=`<rect x="${f(X(lx))}" y="${f(Y(leg)-2)}" width="${f(lg*s)}" height="${f(leg*s+2)}" rx="${f(Math.min(lg*s,leg*s)*.3)}" fill="#9aa1a9" stroke="${INK}" stroke-width="${f(lw)}"/>`;
 const bodyH=(H-cush-leg)*s;
 if(bodyH>0)o+=`<rect x="${f(X(0))}" y="${f(Y(H-cush))}" width="${f(D*s)}" height="${f(bodyH)}" rx="${f(Math.min(fs*.45,bodyH/3))}" fill="${TY.seat[1]}" stroke="${INK}" stroke-width="${f(lw*1.4)}"/>`;
 if(cush>0)o+=`<rect x="${f(X(0))}" y="${f(Y(H))}" width="${f(D*s)}" height="${f(cush*s)}" rx="${f(Math.min(fs*.55,cush*s/2.5))}" fill="#eef0f2" stroke="${INK}" stroke-width="${f(lw*1.4)}"/>`;
 if(hasB)o+=`<rect x="${f(X(D-bD))}" y="${f(Y(H+bH))}" width="${f(bD*s)}" height="${f(bH*s+1)}" rx="${f(Math.min(fs*.55,bH*s/2.2))}" fill="#e3e6ea" stroke="${INK}" stroke-width="${f(lw*1.4)}"/>`;
 const dx=X(0)-fs*.9;
 o+=line(X(0)-fs*.2,Y(H),dx-fs*.3,Y(H),st.lw*.75)+dimSeg(dx,yF,dx,Y(H),L1(H),'left',st);
 if(hasB){const rx=X(D)+fs*.9;o+=line(X(D)+fs*.2,Y(tot),rx+fs*.3,Y(tot),st.lw*.75)+line(X(D)+fs*.2,yF,rx+fs*.3,yF,st.lw*.75)+dimSeg(rx,yF,rx,Y(tot),L1(tot),'right',st)}
 return o}

function tableRows(){const p=S.p,it=S.b.items,rows=[];const bb=it.length?bbox(it):null;

  let s=(cw-mX)/W;s=Math.min(s,(Math.max(360,innerHeight*.66)-mY)/Hh);s=clamp(s,.25,6);
  EV={s,vw:W*s+mX,vh:Hh*s+mY,ox:LD.m.left+(pad-b0.x0)*s,oy:LD.m.top+(pad-b0.y0)*s}}

 const gs=10*Math.max(1,Math.ceil(Math.max(cx1-cx0,cy1-cy0)/10/300)),g5=gs*5;   // legfeljebb ~300 rácsvonal irányonként

 for(let y=Math.floor(cy0/gs)*gs;y<=cy1;y+=gs)o+=line(0,T.Y(y),EV.vw,T.Y(y),y%g5?.6*k:1*k,y%g5?'#eef0f2':'#dde1e6');

  for(const [kk,[hx,hy,c]] of Object.entries(H)){if((kk==='n'||kk==='s')&&w<hs*4)continue;if((kk==='e'||kk==='w')&&h<hs*4)continue;

function toCm(e){const svg=$('#kp_cv svg');const r=svg.getBoundingClientRect();return {x:((e.clientX-r.left)*EV.vw/r.width-EV.ox)/EV.s,y:((e.clientY-r.top)*EV.vh/r.height-EV.oy)/EV.s}}
function snapE(v,c,thr,g){let best=null;for(const x of c)if(Math.abs(v-x)<thr&&(best==null||Math.abs(v-x)<Math.abs(v-best)))best=x;return best!=null?best:Math.round(v/g)*g}

 else{if(S.b.sel){S.b.sel='';renderPanel();drawEditor()}return}
 try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!DR||!$('#kp_cv svg'))return;const p=toCm(e),dx=p.x-DR.p.x,dy=p.y-DR.p.y;
 if(!DR.mv){if(Math.hypot(dx,dy)*EV.s<3)return;hist();DR.mv=1}
 const b=S.b.items.find(q=>q.id===DR.id);if(!b)return;const g=num(S.p.snap)||1,thr=9/EV.s,o=DR.o,oth=S.b.items.filter(q=>q.id!==b.id);
 const ex=oth.flatMap(q=>[q.x,q.x+q.w]),ey=oth.flatMap(q=>[q.y,q.y+q.h]);
 if(DR.m==='m'){b.x=r1(snapMove(o.x+dx,o.w,ex,thr,g));b.y=r1(snapMove(o.y+dy,o.h,ey,thr,g))}
 else{let l=o.x,rr=o.x+o.w,t=o.y,bt=o.y+o.h;const hh=DR.h,mn=Math.max(g,1);
  if(hh.includes('w'))l=Math.min(snapE(o.x+dx,ex,thr,g),rr-mn);

  b.x=r1(l);b.y=r1(t);b.w=r1(rr-l);b.h=r1(bt-t)}
