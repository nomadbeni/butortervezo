<style>
:root{
 --bg:#f3f6f9;--bg2:#ffffff;--fg:#0f172a;--muted:#64748b;--line:#e2e8f0;--hover:rgba(15,23,42,.05);
 --accent:#0284c7;--accent2:#0ea5e9;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;
 --in:#f8fafc;--glass:rgba(255,255,255,.85);--shadow:0 10px 30px -12px rgba(15,23,42,.25),0 2px 6px rgba(15,23,42,.06);
 --hdr:56px;--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111b;--bg2:#121a28;--fg:#e5e7eb;--muted:#94a3b8;--line:#223047;--hover:rgba(226,232,240,.07);--accent:#38bdf8;--accent2:#7dd3fc;--in:#0e1522;--glass:rgba(18,26,40,.85);--shadow:0 14px 36px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b111b;--bg2:#121a28;--fg:#e5e7eb;--muted:#94a3b8;--line:#223047;--hover:rgba(226,232,240,.07);--accent:#38bdf8;--accent2:#7dd3fc;--in:#0e1522;--glass:rgba(18,26,40,.85);--shadow:0 14px 36px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:0;z-index:20;height:calc(var(--hdr) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0284c7,#06b6d4);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.ttl{font-weight:800;font-size:16px;white-space:nowrap}
.grow{flex:1}
.ib{width:38px;height:38px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib svg{width:20px;height:20px}
.air{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13px;white-space:nowrap}
.air b{font-weight:700}.air span{color:var(--muted)}
.air:hover{border-color:var(--accent)}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;max-width:1380px;margin:0 auto;padding:18px 16px 40px}
nav.side{position:sticky;top:calc(var(--hdr) + 18px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600}
nav.side button svg{width:18px;height:18px;flex:none}
nav.side button:hover{background:var(--hover);color:var(--fg)}
nav.side button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] nav.side button.on{color:#06202e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.side button.on{color:#06202e}}
nav.side hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
nav.side .ver{font-size:11px;color:var(--muted);padding:8px 12px}

main{min-width:0;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.span2{grid-column:1/-1}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.f>.l{font-size:12px;font-weight:600;color:var(--muted)}
.iw{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--in);overflow:hidden}
.iw:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.iw input{flex:1;min-width:0;border:0;background:transparent;padding:9px 10px;font-variant-numeric:tabular-nums;font-weight:600;outline:none}
.iw select,.iw .u{border:0;border-left:1px solid var(--line);background:transparent;padding:0 8px;font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;white-space:nowrap}
.iw select{cursor:pointer;outline:none}
select.sel,input.txt{border:1px solid var(--line);border-radius:10px;background:var(--in);padding:9px 10px;width:100%;outline:none}
select.sel:focus,input.txt:focus{border-color:var(--accent)}
.seg{display:inline-flex;background:var(--in);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--bg2);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.hint b{color:var(--fg)}

.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv{background:var(--in);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kv small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.kv b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;word-break:break-word}
.kv i{font-style:normal;font-size:12px;color:var(--muted);font-weight:600;margin-left:3px}
.kv.big{grid-column:span 2;background:color-mix(in srgb,var(--accent) 10%,var(--bg2));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.kv.big b{font-size:30px;color:var(--accent)}
.kv .alt{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06202e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06202e}}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--danger)}

.gauge{position:relative;height:30px;border-radius:8px;overflow:hidden;display:flex;font-size:10.5px;font-weight:700;color:#fff}
.gauge div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--fg);box-shadow:0 0 0 2px var(--bg2);border-radius:2px;transition:left .25s}
.zone{font-size:13px;font-weight:600}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.t td.n,.t th.n{text-align:right}
.t tr.best td{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.t input{width:100%;min-width:60px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.t input:hover{border-color:var(--line)}.t input:focus{border-color:var(--accent);background:var(--in)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.pill{display:inline-block;white-space:nowrap;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.pill.na{background:var(--hover);color:var(--muted)}

.tgrid{display:grid;gap:4px}
.tgrid input{width:100%;border:1px solid var(--line);background:var(--in);border-radius:8px;padding:7px 4px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;outline:none;min-width:0}
.tgrid input:focus{border-color:var(--accent)}
.tgrid input.neg{border-color:var(--danger);color:var(--danger)}
.tgrid .hd{font-size:10.5px;color:var(--muted);font-weight:700;text-align:center;align-self:end;font-family:var(--mono)}
.tgrid .rh{font-size:10.5px;color:var(--muted);font-weight:700;font-family:var(--mono);display:flex;align-items:center;justify-content:flex-end;padding-right:4px}

.zeta{display:flex;flex-wrap:wrap;gap:6px}
.zeta button{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.zeta button:hover{border-color:var(--accent);color:var(--fg)}
.seglist{display:flex;flex-direction:column;gap:10px}
.segc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--in)}
.segc .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.segc .top b{font-size:13px}
.segc .out{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.segc .out b{color:var(--fg)}

svg.duct{width:100%;height:auto;max-height:240px}
.chart{width:100%;height:auto}

#modal{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .dlg{background:var(--bg2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
#modal h3{margin:0;font-size:18px}
#menu{position:fixed;inset:0;z-index:45;display:none}
#menu.on{display:block}
#menu .sheet{position:absolute;top:calc(var(--hdr) + env(safe-area-inset-top) + 6px);right:10px;width:min(320px,calc(100% - 20px));background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:75vh;overflow:auto}
.mi{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:500}
.mi:hover{background:var(--hover)}
.mi svg{width:18px;height:18px;color:var(--muted)}
.mh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 10px 4px}
.mi.cur{background:color-mix(in srgb,var(--accent) 12%,transparent)}
#pr_t{min-width:1080px}#pr_t td:nth-child(1){min-width:200px}#pr_t td:nth-child(2){min-width:110px}#pr_t td:nth-child(7){min-width:140px}#pr_t td:nth-child(8){min-width:170px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:all .2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

nav.bot{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr;padding:12px 12px 100px}
 nav.side{display:none}
 nav.bot{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:blur(12px);border-top:1px solid var(--line);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;scrollbar-width:none}
 nav.bot button{flex:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;min-width:64px}
 nav.bot button svg{width:20px;height:20px}
 nav.bot button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
 .grid,.grid.c3{grid-template-columns:1fr}
 .kv.big{grid-column:1/-1}
 .air .x{display:none}
 .ttl{display:none}
}
@media print{
 header,nav,#toast,.noprint,.btn{display:none!important}
 body{background:#fff;color:#000}
 .app{display:block;padding:0}
 .card{box-shadow:none;border:0;padding:0}
 .t input{border:0}
 .tw{border:0;overflow:visible}
}


.logo{background:var(--logo)!important}


:root{--accent:#0f766e;--accent2:#14b8a6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#2dd4bf;--accent2:#5eead4}}
:root[data-theme="dark"]{--accent:#2dd4bf;--accent2:#5eead4}


.prg{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.kcol{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1180px){.prg{grid-template-columns:1fr}}
.tb{gap:6px}.tb .grow{flex:1}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctab{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--in);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px;max-width:260px}
.ctab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctab small{color:var(--muted);font-weight:700;font-size:11px;background:var(--hover);border-radius:999px;padding:0 6px}
.ctab svg{flex:none;color:var(--muted)}
.cgrp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 6px 4px 4px;border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;width:100%}
.glab{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;padding:0 6px}
.ctab .no{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:#475569;color:#fff;font-size:11px;font-weight:800;padding:0 5px}
.ctab.on .no{background:var(--accent)}
#pr_view .seg button{padding:5px 10px;font-size:12.5px}
.ctab:hover{border-color:var(--accent)}
.ctab.on{background:color-mix(in srgb,var(--accent) 14%,var(--bg2));border-color:var(--accent)}
.ctab.on svg{color:var(--accent)}
select.sel.addc{width:auto;padding:6px 10px;font-size:13px;font-weight:600}
.cv{background:#fcfcfa;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;justify-content:center;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none;min-height:200px}
.cv svg{display:block;max-width:100%;height:auto}
.cv .empty{padding:60px 20px;color:#64748b;text-align:center;font-weight:600}
.fields.f2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fields.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:420px){.fields.f3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}.ck input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.ck.sm{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:6px}
.cks{display:flex;flex-direction:column;gap:6px}
.lk{border:0;border-left:1px solid var(--line);background:transparent;padding:0 9px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.lk:hover{color:var(--fg)}.lk.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ilist{display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:22px minmax(0,1fr) 52px minmax(0,104px) auto auto;gap:5px;align-items:center}
.irow .txt{padding:6px 8px;font-size:13px}
.irow .q{text-align:center}
.irow .sel.mv{padding:6px 4px;font-size:12px}
.irow .btn.sm{padding:5px 7px}
.cdot{width:20px;height:20px;border-radius:6px;border:2px solid var(--bg2);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
@media (max-width:480px){.irow{grid-template-columns:22px minmax(0,1fr) 46px auto auto}.irow .sel.mv{grid-column:2/-1;grid-row:2}}
.addrow{display:flex;gap:6px}.addrow .txt{flex:1;padding:7px 9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.srch{align-items:center;padding-left:10px;color:var(--muted)}
.srch input{font-weight:500}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px}
.sheetw{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sheetw svg{display:block;width:100%;height:auto}
#pr_ghost{position:fixed;z-index:70;pointer-events:none;background:var(--accent);color:#fff;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}

@media print{
 html:has(body.rep-on){color-scheme:light!important;background:#fff!important}
 body.rep-on{background:#fff!important}
 body.rep-on>*:not(#rep){display:none!important}
 body.rep-on #rep{display:block!important}
 #rep{page:pr}
 #rep .pg{break-after:page;page-break-after:always}
 #rep .pg:last-child{break-after:auto;page-break-after:auto}
 #rep svg{display:block;width:100%;height:auto;max-height:193mm}
}
@page pr{size:A4 landscape;margin:8mm}

</style>

/* ===== import-ellenőrzés (közös) =====
   Szabályok: a fájl legfeljebb 2 MB, érvényes JSON objektum, a megfelelő "app" mezővel.
   Kötelező méretek (nem véges vagy tartományon kívüli szám) és a darabszám-korlátok átlépése -> elutasítás, érthető üzenettel.
   Opcionális mezők (szövegek, kapcsolók, választók) hibás típus esetén alapértékre állnak, a szövegek hossza korlátozott.
   Az importált azonosítókat az app nem használja: minden elem új, belső azonosítót kap. */
const IMP_MAX_BYTES=2*1024*1024;
class ImportErr extends Error{constructor(m){super(m);this.name='ImportErr'}}
const impFail=m=>{throw new ImportErr(m)};
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
/* egysoros szöveg: sortörés és TAB szóközre, egyéb vezérlőkarakter törölve, hossz korlátozva */
const vStr=(v,max=200,def='')=>(typeof v==='string'?v:(typeof v==='number'&&Number.isFinite(v)?String(v):def)).replace(/[\t\r\n]+/g,' ').replace(/[\u0000-\u001f\u007f]/g,'').slice(0,max);
const vNumRaw=v=>typeof v==='number'?v:(typeof v==='string'&&v.trim()!==''&&v.length<40?num(v):NaN);
const vNum=(v,lo,hi,what)=>{const n=vNumRaw(v);if(!Number.isFinite(n)||n<lo||n>hi)impFail(`Érvénytelen érték: ${what} (${lo} és ${hi} közötti szám kell)`);return n};
const vNumOpt=(v,lo,hi,def)=>{const n=vNumRaw(v);return Number.isFinite(n)?Math.min(hi,Math.max(lo,n)):def};
const vArr=(v,max,what,min=0)=>{if(!Array.isArray(v))impFail(`Hiányzó vagy hibás lista: ${what}`);if(v.length>max)impFail(`Túl sok elem: ${what} (legfeljebb ${max})`);if(v.length<min)impFail(`Üres lista: ${what}`);return v};
const vObj=(v,what)=>{if(!isObj(v))impFail(`Hibás adat: ${what}`);return v};
const vOne=(v,list,def)=>list.includes(v)?v:def;
const vFlag=v=>v===true||v===1||v==='1'?'1':'';
const vBool=v=>v===true||v===1||v==='1'?1:0;
function parseImport(text,app,appName){if(typeof text!=='string')impFail('A fájl nem szöveges.');
 if(text.length>IMP_MAX_BYTES)impFail('A fájl túl nagy (legfeljebb 2 MB lehet).');
 let d;try{d=JSON.parse(text)}catch(e){impFail('A fájl nem érvényes JSON.')}
 if(!isObj(d))impFail('A fájl nem tervfájl.');if(d.app!==app)impFail(`Ez nem ${appName} fájl.`);return d}
/* fájl beolvasása + ellenőrzése; a validate függvény a kész, ellenőrzött adatot adja vissza vagy ImportErr-t dob */
function readImport(file,app,appName,validate){return new Promise((res,rej)=>{
 if(!file)return rej(new ImportErr('Nincs fájl kiválasztva.'));
 if(file.size>IMP_MAX_BYTES)return rej(new ImportErr(`A fájl túl nagy (${(file.size/1048576).toFixed(1)} MB, legfeljebb 2 MB lehet).`));
 const rd=new FileReader();rd.onerror=()=>rej(new ImportErr('A fájl nem olvasható.'));
 rd.onload=()=>{try{res(validate(parseImport(rd.result,app,appName)))}catch(e){rej(e instanceof ImportErr?e:new ImportErr('Hibás tervfájl.'))}};
 rd.readAsText(file)})}
/* ===== tárolt terv védelme =====
   Betöltéskor hibás tárolt terv: az eredeti szöveg a <prefix>.state.bak kulcsra kerül, és a menüből letölthető (nem vész el csendben).
   Szerkesztéskor: az app guard()-ja minden mentés előtt ugyanazzal az ellenőrzéssel nézi az állapotot, mint az import;
   ha nem felel meg (pl. túl nagy méret, túl sok elem), a módosítást visszavonja, így a tárolt terv mindig betölthető marad. */
const bakKey=p=>p+'.state.bak';
function keepBadState(prefix){const raw=store.get(prefix+'.state');if(raw)store.set(bakKey(prefix),raw)}
const bakMenu=prefix=>store.get(bakKey(prefix))?`<button class="mi" data-m="bak">${ic('dl')}Hibás tárolt terv letöltése</button>`:'';
function downloadBak(prefix){const raw=store.get(bakKey(prefix));if(!raw)return;download(prefix+'_hibas_tarolt_terv.json',raw,'application/json');store.del(bakKey(prefix));toast('Letöltve; a böngészőből törölve.')}
/* check(): érvényes-e az állapot; snapshot(): az állapot szövegként; apply(d): visszaállítás egy korábbi pillanatképre.
   Visszaállítás mindig az utolsó, ellenőrzésen átment állapotra történik (nem a visszavonási verem tetejére). */
function makeGuard(check,snapshot,apply){let busy=false,last=null;
 return ()=>{if(busy)return true;try{check();last=snapshot();return true}catch(e){
  busy=true;const msg=e instanceof ImportErr?e.message:'Érvénytelen állapot.';
  try{if(last){apply(JSON.parse(last));toast(msg+' A módosítás visszavonva.')}else toast(msg+' A terv nem menthető: mentsd JSON-ba.')}
  catch(_){toast('A terv nem menthető: mentsd JSON-ba.')}finally{busy=false}return false}}}

function wrap(t,n){const ws=String(t).split(/\s+/).filter(Boolean),ls=[];let cur='';
 for(const w of ws){const c=cur?cur+' '+w:w;if(c.length<=n||!cur)cur=c;else{ls.push(cur);cur=w}}if(cur)ls.push(cur);
 return ls.map(l=>l.length>n?trunc(l,n):l)}

/* ---------- arányos méretezés ----------
   A rögzítetlen elemek egymás közti aránya megmarad, a rögzített (lakat) és az éppen szerkesztett elem mérete nem változik. */
/* visszatérés: 'ok' – minden rögzített és a szerkesztett elem megmaradt; 'adj' – a szerkesztett elem a rögzítettek
   miatt más méretet kapott; 'lock' – a rögzített elemek nem fértek el, ezért ezek is változtak */
function fit(arr,key,total,keep=-1){const n=arr.length;if(!n)return 'ok';
 if(n===1){const o=arr[0][key];arr[0][key]=r1(total);return Math.abs(o-total)<.05||keep<0?'ok':'adj'}
 let fx=[],fl=[],st='ok';arr.forEach((x,i)=>(i===keep||x.lock?fx:fl).push(i));
 if(!fl.length){
  if(keep>=0){const others=arr.reduce((s,x,i)=>i===keep?s:s+(+x[key]||0),0),v=r1(total-others);
   if(v>=MINR){const ch=Math.abs(v-arr[keep][key])>.05;arr[keep][key]=v;return ch?'adj':'ok'}}
  fl=arr.map((_,i)=>i).filter(i=>i!==keep);fx=keep>=0?[keep]:[];st='lock'}
 else if(keep>=0){/* a szerkesztett érték ne nyomja össze a rögzítetteket: legfeljebb a maradék hely (a szabadoknak min. MINR) */
  const locked=fx.reduce((s,i)=>i===keep?s:s+(+arr[i][key]||0),0),mx=r1(total-locked-fl.length*MINR);
  if(mx>=MINR&&arr[keep][key]>mx){arr[keep][key]=mx;st='adj'}}
 const sf=fx.reduce((s,i)=>s+(+arr[i][key]||0),0);let free=total-sf;
 if(free<fl.length*MINR){free=fl.length*MINR;const rem=total-free;fx.forEach(i=>arr[i][key]=sf>0?Math.max(MINR,arr[i][key]*rem/sf):MINR);
  st=fx.some(i=>i!==keep)?'lock':'adj'}
 const sl=fl.reduce((s,i)=>s+Math.max(0,+arr[i][key]||0),0);
 fl.forEach(i=>arr[i][key]=sl>0?Math.max(0,+arr[i][key]||0)*free/sl:free/fl.length);
 arr.forEach(x=>x[key]=r1(x[key]));
 const diff=r1(total-arr.reduce((s,x)=>s+x[key],0)),li=fl[fl.length-1];arr[li][key]=r1(arr[li][key]+diff);return st}

 const ox=bx.x+mL+((bx.w-mL-mR)-L.W*s)/2,oy=bx.y+mT+((bx.h-mT-mB)-L.H*s)/2;
 const FX=v=>ox+v*s,FY=v=>oy+(L.H-v)*s;
 let g='',defs='';const cells=[];
 if(hasS)g+=floorSVG(FX(-16),FX(L.W+16),FY(0),s);
 if(hasW){const yt=Math.max(...L.wl.map(c=>c.elev+c.H));g+=line(FX(-16),FY(yt)-7,FX(L.W+16),FY(yt)-7,1.2,'#94a3b8',' stroke-dasharray="5 3"')}
 L.order.forEach((c,i)=>{const p=L.pos.get(c.id),X=v=>FX(p.x)+v*s,Y=v=>FY(p.y+c.H)+v*s;
  const r=cabSVG(c,X,Y,s,{...o,pid:o.pid||'r'});g+=r.g;defs+=r.defs;cells.push(...r.cells);
  const cur=o.cur===c.id;if(cur)g+=rect(X(0)-3,Y(0)-3,c.W*s+6,c.H*s+6,'none',ACC,2.2,' stroke-dasharray="6 4" pointer-events="none"');
  const bcx=X(c.W/2),bcy=Y(0)-13,br=Math.min(10,Math.max(7,c.W*s/4));
  g+=`<g${o.edit?` data-cab="${c.id}" style="cursor:pointer"`:''}><circle cx="${f(bcx)}" cy="${f(bcy)}" r="${f(br)}" fill="${cur?ACC:'#475569'}"/>${tx(bcx,bcy+br*.4,String(i+1),br*1.15,700,'middle','#fff')}</g>`});
 /* méretek */
 if(hasS){let prev=0;for(const c of L.st){const p=L.pos.get(c.id);if(p.x-prev>.05)g+=dimH(FY(0)+20,FX(prev),FX(p.x),L1(p.x-prev),dfs*.8,FY(0));g+=dimH(FY(0)+20,FX(p.x),FX(p.x+c.W),L1(c.W),dfs*.85,FY(0));prev=p.x+c.W}}
 g+=dimH(hasS?FY(0)+46:FY(0)+20,FX(0),FX(L.W),L1(L.W),dfs,FY(0));
 if(hasW){const yd=oy-36;let prev=0;for(const c of L.wl){const p=L.pos.get(c.id);if(p.x-prev>.05)g+=dimH(yd,FX(prev),FX(p.x),L1(p.x-prev),dfs*.8);g+=dimH(yd,FX(p.x),FX(p.x+c.W),L1(c.W),dfs*.85,FY(p.y+c.H)-22);prev=p.x+c.W}}
 /* bal oldal: az első álló szekrény és a teljes magasság; jobb oldal: az utolsó falra szerelt szekrény magassága a padlótól */
 const s0=L.st[0],wN=L.wl[L.wl.length-1];
 if(s0)g+=dimV(FX(0)-22,FY(0),FY(s0.H),L1(s0.H),dfs*.85,FX(0));
 if(!s0||Math.abs(L.H-s0.H)>.05)g+=dimV(FX(0)-(s0?46:22),FY(0),FY(L.H),L1(L.H),dfs,FX(0));
 if(wN){const p=L.pos.get(wN.id),xr=FX(L.W)+26,ex=FX(p.x+wN.W);if(wN.elev>.05)g+=dimV(xr,FY(0),FY(wN.elev),L1(wN.elev),dfs*.85,ex);g+=dimV(xr,FY(wN.elev),FY(wN.elev+wN.H),L1(wN.H),dfs*.85,ex)}
 return {svg:`<defs>${defs}</defs>`+g,cells,s,L}}

function sheetSVG(tg){const p=S.p,M=16,isRow=!!tg.g;
 const G=isRow?grp(tg.g):null,L=isRow?rowLayout(tg.g):null,cs=isRow?L.order:[tg.c];
 let o=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${SW} ${SH}" width="${SW}" height="${SH}" font-family="${FONT}"><rect width="${SW}" height="${SH}" fill="#fff"/>`;
 o+=rect(M,M,SW-2*M,SH-2*M,'none',INK,2.2);
 const tbH=76,ty=SH-M-tbH,W0=SW-2*M;o+=line(M,ty,SW-M,ty,2.2);
 const cw=[.27,.25,.18,.17,.13].map(k=>k*W0);let cx=M;const c=tg.c;
 const cellsTB=isRow?[[p.proj||'Projekt',p.title||''],['Szekrénysor',G?G.name:''],['Szekrények',`${cs.length} db`],['Teljes méret (sz × m)',`${L1(L.W)} × ${L1(L.H)} cm`],[p.date||'Dátum',p.author||'']]
  :[[p.proj||'Projekt',p.title||''],['Szekrény',c.name],['Típus',TYP[c.type].n],['Külső méret (sz × m × mé)',`${L1(c.W)} × ${L1(c.H)} × ${L1(c.D)} cm`],[p.date||'Dátum',p.author||'']];
 cellsTB.forEach(([a,b],i)=>{if(i)o+=line(cx,ty,cx,SH-M,1.4);const w=cw[i],n=Math.floor((w-24)/(13*.56));
  if(i===0){o+=tx(cx+12,ty+32,trunc(b||'POLCKIOSZTÁS',Math.floor((w-24)/(20*.6))),20,800);o+=tx(cx+12,ty+56,trunc(a,n),13,500,'start','#475569')}
  else{o+=tx(cx+12,ty+26,trunc(a,n),11.5,600,'start','#64748b');o+=tx(cx+12,ty+52,trunc(b||'–',Math.floor((w-24)/(16*.58))),16,700)}
  cx+=w});
 const its=cs.reduce((s,x)=>s+nItems(x),0),tbl=p.tbl&&its>0,top=M+20,bot=ty-20,dx=M+20,dw=tbl?Math.min(isRow?840:800,(SW-2*M)*(isRow?.6:.56)):SW-2*M-40;
 const box={x:dx,y:top+24,w:dw,h:bot-top-24},op={fs:isRow?13:15,dfs:isRow?13:15,hs:!!p.hs};
 const fr=isRow?rowSVG(tg.g,box,{...op,pid:'sr'+tg.g}):frontSVG(c,box,{...op,pid:'s'+c.id});
 o+=tx(dx,top+12,isRow?'Szekrénysor elölnézete (ajtók nélkül) – a körben a szekrény sorszáma, méretek cm-ben':'Elölnézet (ajtók nélkül) – méretek cm-ben',13,600,'start','#64748b');
 o+=fr.svg;
 if(tbl){const px=dx+dw+28,pw=SW-M-20-px,c1=isRow?62:56,c2=isRow?110:118,c3=pw-c1-c2;
  const rows=[];cs.forEach((cb,k)=>cb.cols.forEach((col,ci)=>col.rows.forEach((row,ri)=>rows.push({cd:(isRow?`${k+1} / `:'')+code(cb,ci,ri),sz:`${L1(col.w)} × ${L1(row.h)}`,txt:(row.kind==='drawer'?'Fiók: ':'')+(row.items.map(itemLabel).join(', ')||'–'),e:!row.items.length}))));
  const list=isRow?rows.filter(r=>!r.e):rows;
  const hH=30,avail=bot-top-hH-26;let fs=15,lay;
  const doLay=fs=>{const n=Math.max(8,Math.floor((c3-16)/(fs*.56))),lh=fs*1.32;return list.map(r=>{const ls=wrap(r.txt,n);return {...r,ls,h:Math.max(1,ls.length)*lh+10,lh}})};
  for(fs=15;fs>=9;fs--){lay=doLay(fs);if(lay.reduce((s,r)=>s+r.h,0)<=avail)break}
  if(fs<9)fs=9;
  o+=rect(px,top,pw,hH,'#f1f5f9',INK,1.2);
  o+=tx(px+8,top+20,'Rekesz',12,700,'start','#334155')+tx(px+c1+8,top+20,'Belméret (sz × m)',12,700,'start','#334155')+tx(px+c1+c2+8,top+20,'Tartalom',12,700,'start','#334155');
  let y=top+hH,cut=0;
  for(let i=0;i<lay.length;i++){const r=lay[i];let ls=r.ls,h=r.h;
   if(y+h>top+hH+avail){const fitL=Math.floor((top+hH+avail-y-10)/r.lh);if(fitL<1){cut=lay.length-i;break}ls=ls.slice(0,fitL);ls[fitL-1]=trunc(ls[fitL-1],Math.max(4,ls[fitL-1].length-1))+'…';h=fitL*r.lh+10;cut=lay.length-i-1}
   if(i%2)o+=rect(px,y,pw,h,'#fafafa');
   o+=tx(px+8,y+fs+3,r.cd,fs*(isRow?.92:1),800,'start',ACC)+tx(px+c1+8,y+fs+3,r.sz,fs*.9,500,'start','#475569');
   ls.forEach((l,k)=>o+=tx(px+c1+c2+8,y+fs+3+k*r.lh,l,fs,r.e?400:500,'start',r.e?'#94a3b8':INK));
   y+=h;o+=line(px,y,px+pw,y,.6,'#cbd5e1');if(cut)break}
  o+=rect(px,top,pw,y-top,'none',INK,1.2)+line(px+c1,top,px+c1,y,.6,'#cbd5e1')+line(px+c1+c2,top,px+c1+c2,y,.6,'#cbd5e1');
  o+=tx(px,y+20,cut?`+${cut} rekesz nem fért ki – a teljes lista a CSV leltárban.`:isRow?'Csak a nem üres rekeszek. Kód: szekrény sorszáma / rekesz.':'A rekeszmagasság a polcok közötti tiszta (bel)méret. Számozás felülről lefelé.',11.5,500,'start','#64748b')}
 return o+'</svg>'}

 const rm=rowMode(),L=rm?rowLayout(c.g):null,vw=Math.max(300,cv.clientWidth-2),maxH=Math.round(clamp(innerHeight*.66,380,780)),
  need=rm?(vw-12-80)/L.W*L.H+130:(vw-12-70)/c.W*c.H+100,vh=Math.round(clamp(need,260,maxH));
 const op={edit:1,sel:S.c.cell,fs:rm?12:13,dfs:12,hs:!!S.p.hs,pid:'e'},bx={x:6,y:6,w:vw-12,h:vh-12};
 const fr=rm?rowSVG(c.g,bx,{...op,cur:c.id}):frontSVG(c,bx,op);
 EV={vw,vh,cells:fr.cells};
 cv.innerHTML=`<svg viewBox="0 0 ${vw} ${vh}" width="${vw}" height="${vh}" font-family="${FONT}" aria-label="${rm?'Szekrénysor':'Szekrény'} elölnézet">${fr.svg}<rect id="pr_hl" x="0" y="0" width="0" height="0" fill="${ACC}" fill-opacity=".18" stroke="${ACC}" stroke-width="2.5" stroke-dasharray="6 4" pointer-events="none" visibility="hidden"/></svg>`}

function selectCell(id){S.c.cell=id;const fr=findRow(id);if(fr)S.c.sel=fr.c.id;ui.save();drawEditor();renderPanel()}
document.addEventListener('pointerdown',e=>{const cv=e.target.closest('#pr_cv');if(!cv||e.button>0||!EV)return;
 const it=e.target.closest('[data-it]'),ce=e.target.closest('[data-cell]');
 if(it){DR={id:it.dataset.it,from:it.dataset.row,x:e.clientX,y:e.clientY,mv:0};try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();return}
 if(ce){selectCell(ce.dataset.cell);return}
 const cb=e.target.closest('[data-cab]');if(cb){S.c.sel=cb.dataset.cab;S.c.cell='';refresh()}});

  const fi=findItem(DR.id);const gh=document.createElement('div');gh.id='pr_ghost';gh.textContent=fi?itemLabel(fi.it):'';document.body.appendChild(gh)}
 const gh=$('#pr_ghost');if(gh){gh.style.left=e.clientX+12+'px';gh.style.top=e.clientY+8+'px'}

function setCols(c,n){n=clamp(Math.round(n),1,8);if(n===c.cols.length)return;
 if(n>c.cols.length){const last=c.cols[c.cols.length-1];while(c.cols.length<n)c.cols.push({id:uid(),w:last.w,lock:0,rows:last.rows.map(r=>mkRow(r.h,r.kind))})}
 else{const rem=c.cols.splice(n);const tgt=c.cols[c.cols.length-1];rem.forEach(col=>col.rows.forEach((r,ri)=>{const t=tgt.rows[Math.min(ri,tgt.rows.length-1)];t.items.push(...r.items)}))}
 fitMsg(fitCab(c),'oszlopszélességek')}
function setRows(c,col,n){n=clamp(Math.round(n),1,40);if(n===col.rows.length)return;
 if(n>col.rows.length){const avg=col.rows.reduce((s,r)=>s+r.h,0)/col.rows.length;while(col.rows.length<n)col.rows.push(mkRow(avg))}
 else{const rem=col.rows.splice(n);col.rows[n-1].items.push(...rem.flatMap(r=>r.items));if(!col.rows.some(r=>r.id===S.c.cell))S.c.cell=col.rows[n-1].id}
 fit(col.rows,'h',clearH(c,col))}

 const last=fr.row.items[fr.row.items.length-1];for(const n of names)fr.row.items.push(mkIt(n,'',last?last.col:0));return names.length}

 if(gid&&grp(gid)){c.g=gid;const L=grpCabs(gid);const last=L[L.length-1];S.c.list.splice(S.c.list.indexOf(last)+1,0,c);S.c.view='row'}else S.c.list.push(c);
 S.c.sel=c.id;S.c.cell=c.cols[0].rows[0].id;if(!ui.save())return;ui.setTab('cab');ui.render();toast('Új szekrény: '+c.name+(c.g?` (sor: ${grp(c.g).name})`:''))}

 $('#modal').classList.add('on');setTimeout(()=>{const e=$('#rn_name');e.focus();e.select()},30)}

 if(!PRE[k]){toast('Válassz sablont');return}if(!ok(w)||w<10){toast('A szélesség legalább 10 cm');return}
 hist();const G={id:uid(),name};S.c.groups=[...(S.c.groups||[]),G];let first=null;
 for(let j=0;j<n;j++){const c=mkCab(k,+i||0,`${name} ${j+1}`);c.W=w;c.g=G.id;fitCab(c);S.c.list.push(c);first=first||c}

function moveInRow(c,dir){const lane=S.c.list.filter(x=>x.g===c.g&&!!x.fal===!!c.fal),i=lane.indexOf(c),o=lane[i+dir];if(!o)return;hist();

function act(a,el){const c=cab();
 switch(a){

  case 'open':$('#pr_file').click();return;
  case 'new':if(!confirm('Új, üres projektet kezdesz? Minden szekrény törlődik. (Ctrl+Z visszavonja)'))return;hist();S.c.list=[];S.c.groups=[];S.c.sel='';S.c.cell='';ui.save();ui.render();return;

  case 'goto':{const fr=findRow(el.dataset.row);if(!fr)return;S.c.sel=fr.c.id;S.c.cell=fr.row.id;ui.setTab('cab');ui.save();ui.render();window.scrollTo({top:0});return}}
 if(!c)return;
 switch(a){
  case 'ctype':hist();c.type=el.dataset.v;refresh();return;
  case 'cleft':moveInRow(c,-1);return;case 'cright':moveInRow(c,1);return;
  case 'gdel':{const G=grp(c.g);if(!G||!confirm(`Feloszlatod a(z) „${G.name}” sort? A szekrények megmaradnak, önállóként.`))return;hist();for(const x of S.c.list)if(x.g===G.id)x.g='';refresh();return}
  case 'cdup':{hist();const d=JSON.parse(JSON.stringify(c));d.id=uid();d.name=c.name+' (másolat)';d.cols.forEach(col=>{col.id=uid();col.rows.forEach(r=>{r.id=uid();r.items.forEach(it=>it.id=uid())})});S.c.list.splice(S.c.list.indexOf(c)+1,0,d);S.c.sel=d.id;S.c.cell='';if(refresh())toast('Másolat elkészült');return}
  case 'cdel':if(!confirm(`Törlöd: „${c.name}”? (Ctrl+Z visszavonja)`))return;hist();S.c.list.splice(S.c.list.indexOf(c),1);S.c.sel=S.c.list[0]?S.c.list[0].id:'';S.c.cell='';refresh();return}
 const fr=S.c.cell?findRow(S.c.cell):null;if(!fr)return;const {col,row}=fr;
 switch(a){
  case 'clock':hist();col.lock=col.lock?0:1;break;
  case 'rlock':hist();row.lock=row.lock?0:1;break;
  case 'ceven':hist();evenOut(col.rows,'h',clearH(c,col));toast('Polcközök egyenletesen elosztva');break;
  case 'rkind':hist();row.kind=el.dataset.v;break;
  case 'rsplit':{hist();const h=(row.h-c.t)/2;if(h<MINR){toast('Ez a rekesz túl alacsony a kettéosztáshoz');return}const nr=mkRow(r1(h),row.kind);row.h=r1(row.h-c.t-nr.h);row.lock=0;col.rows.splice(fr.ri+1,0,nr);fit(col.rows,'h',clearH(c,col));break}
  case 'rmerge':{if(col.rows.length<2)return;hist();const i=fr.ri<col.rows.length-1?fr.ri+1:fr.ri-1,o=col.rows[i];row.h=r1(row.h+c.t+o.h);row.items.push(...o.items);col.rows.splice(i,1);fit(col.rows,'h',clearH(c,col));break}
  case 'iadd':{const inp=$('#pr_new');const n=addItems(fr,inp?inp.value:'');if(!n){inp&&inp.focus();return}refresh();const ni=$('#pr_new');if(ni)ni.focus();return}
  case 'idel':{const i=row.items.findIndex(x=>x.id===el.dataset.id);if(i<0)return;hist();row.items.splice(i,1);break}
  case 'iup':{const i=row.items.findIndex(x=>x.id===el.dataset.id);if(i<1)return;hist();[row.items[i-1],row.items[i]]=[row.items[i],row.items[i-1]];break}
  case 'icol':{const it=row.items.find(x=>x.id===el.dataset.id);if(!it)return;hist();it.col=(it.col+1)%ICOL.length;break}
  default:return}
 refresh()}

 if(t.dataset.imv){const to=t.value;if(to)moveItem(t.dataset.imv,to);return}});
