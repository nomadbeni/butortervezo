name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python build szkriptek ellenőrzése
        run: python -m py_compile src/*.py

      - name: Build és egyezés a commitolt HTML-ekkel
        run: |
          npm run build
          git diff --exit-code -- '*.html' || (echo "::error::A kész HTML-ek nem egyeznek a forrással – futtasd: npm run build, és commitold az eredményt." && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Függőségek (rögzített verziók a package-lock.json alapján)
        run: npm ci

      - name: JavaScript szintaxis és kezdőlap-linkek
        run: npm run check

      - name: Chromium telepítése a Playwrighthoz
        run: npx playwright install --with-deps chromium

      - name: Böngészős és logikai tesztek
        run: npx playwright test

      - name: Tesztjelentés feltöltése hiba esetén
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
